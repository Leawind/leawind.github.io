name: Deploy to Github Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.0
          cache: true

      - name: Install dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if deno ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to install dependencies after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 5))
            echo "::warning::Dependency download failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Check and build documentation
        run: deno task docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
